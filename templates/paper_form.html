{% extends "base.html" %}
{% block content %}
<h1>{{ 'New paper' if new else 'Edit paper #' ~ p.paper_id }}</h1>
<form method="post" class="stack card">
  <label>Title</label><input type="text" name="title" value="{{ p.get('title', '') }}" required>
  <label>Abstract</label><textarea name="abstract" required>{{ p.get('abstract', '') }}</textarea>
  <div class="grid2">
    <div><label>Track</label>
      <select name="track_id" required>
        {% for t in tracks %}<option value="{{ t.track_id }}" {{ 'selected' if p.get('track_id')|string == t.track_id|string }}>{{ t.acronym }} – {{ t.name }}</option>{% endfor %}
      </select></div>
    <div><label>Submission date</label><input type="date" name="submission_date" value="{{ p.get('submission_date', '') }}" required></div>
    <div><label>Status</label>
      <select name="status">
        {% for s in statuses %}<option {{ 'selected' if p.get('status') == s }}>{{ s }}</option>{% endfor %}
      </select></div>
    <div><label>Session <span class="hint">(only accepted papers, same conference as the track)</span></label>
      <select name="session_id">
        <option value="">— not scheduled —</option>
        {% for s in sessions %}<option value="{{ s.session_id }}" {{ 'selected' if p.get('session_id')|string == s.session_id|string }}>{{ s.acronym }} – {{ s.title }} ({{ s.session_date|d }})</option>{% endfor %}
      </select></div>
  </div>
  {% if new %}
  <fieldset><legend>First author, keywords and version</legend>
    <div class="grid2">
      <div><label>Corresponding author (position 1)</label>
        <select name="author_id" required>
          {% for a in authors %}<option value="{{ a.user_id }}" {{ 'selected' if p.get('author_id')|string == a.user_id|string }}>{{ a.given_name }} {{ a.surname }} ({{ a.email }})</option>{% endfor %}
        </select></div>
      <div><label>Keywords <span class="hint">(separate with commas)</span></label><input type="text" name="keywords" value="{{ p.get('keywords', '') }}" required></div>
    </div>
    <label>File location of version 1</label><input type="text" name="file_location" value="{{ p.get('file_location', '') }}" placeholder="/storage/papers/new/v1.pdf" required>
    <p class="hint">More authors, keywords and versions can be added on the paper page after saving.</p>
  </fieldset>
  {% endif %}
  <p><button>Save</button>
     <a class="btn light" href="{{ url_for('papers') if new else url_for('paper_detail', paper_id=p.paper_id) }}">Cancel</a></p>
</form>
{% endblock %}
